<!doctype html>
<html lang="<!-- figma:lang -->">
  <head>
    <!-- figma:head-start -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title><!-- figma:title --></title>
    <!-- figma:head-end -->
  </head>
  <body>
    <!-- figma:body-start -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- VLibras: tradução do texto para Libras (widget do governo federal). Se não carregar, o site segue funcionando normalmente. -->
    <div vw class="enabled">
      <div vw-access-button class="active"></div>
      <div vw-plugin-wrapper>
        <div class="vw-plugin-top-wrapper"></div>
      </div>
    </div>
    <script>
      window.addEventListener('load', function () {
        var script = document.createElement('script');
        script.src = 'https://vlibras.gov.br/app/vlibras-plugin.js';
        script.onload = function () {
          try { new window.VLibras.Widget('https://vlibras.gov.br/app'); } catch (e) {}
        };
        script.onerror = function () {
          var widget = document.querySelector('[vw]');
          if (widget) widget.remove();
        };
        document.body.appendChild(script);
      });
    </script>
    <!-- figma:body-end -->
  </body>
</html>
