<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="PetLocal: cadastre seus pets com código ou QR code de identificação e ajude pets perdidos a voltar para casa. Quem encontra um pet avisa o dono, e o dono pode criar um aviso de Procura-se." />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>PetLocal</title>
  </head>
  <body>
    <!-- VLibras: tradução do conteúdo para Libras (widget do governo federal) -->
    <div vw class="enabled">
      <div vw-access-button class="active"></div>
      <div vw-plugin-wrapper>
        <div class="vw-plugin-top-wrapper"></div>
      </div>
    </div>
    <div id="root"></div>
    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <script>
      if (window.VLibras) new window.VLibras.Widget("https://vlibras.gov.br/app")
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
